# DigitalOcean Functions project for DawaDekho.
# Deploy with: doctl serverless deploy . --remote-build
#
# Set the secret once (never commit it):
#   doctl serverless functions invoke ...   # after:
#   export GEMINI_API_KEY=...   (referenced below)
targets: []
parameters: {}
environment: {}
packages:
  - name: api
    shared: false
    functions:
      - name: read-strip
        binary: false
        main: ''
        runtime: 'nodejs:18'
        web: raw          # receive the raw image body, control the response
        webSecure: false
        parameters: {}
        environment:
          GEMINI_API_KEY: ${GEMINI_API_KEY}   # from your shell / DO env, never committed
          GEMMA_MODEL: ${GEMMA_MODEL}
          ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
        limits:
          timeout: 20000   # ms; our upstream call caps at 12s
          memory: 256      # MB
        annotations:
          description: 'Reads a printed medicine strip with Gemma 4 and returns strict JSON.'
