name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Validate dataset
        run: node scripts/validate-data.js
      - name: Run tests
        run: node --test
