# DigitalOcean App Platform spec for DawaDekho.
# A free static site + a serverless function, all on free tiers.
#
# Deploy:
#   doctl apps create --spec .do/app.yaml
# or point the App Platform UI at this repo and it will read this file.
#
# Set GEMINI_API_KEY as an encrypted app-level secret in the DO dashboard or:
#   doctl apps update <app-id> --spec .do/app.yaml   (after editing the value)
name: dawadekho
region: blr   # Bangalore, closest to Indian users

static_sites:
  - name: web
    github:
      repo: cody-abhi/codexsensei
      branch: main
      deploy_on_push: true
    source_dir: /
    # Static files are served from the repo root as-is (no build step).
    output_dir: /
    index_document: index.html
    error_document: index.html
    catchall_document: index.html
    routes:
      - path: /

functions:
  - name: api
    github:
      repo: cody-abhi/codexsensei
      branch: main
      deploy_on_push: true
    source_dir: /
    routes:
      - path: /api
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
      - key: GEMMA_MODEL
        scope: RUN_TIME
        value: "gemma-4-26b-a4b-it"
      - key: ALLOWED_ORIGIN
        scope: RUN_TIME
        value: "*"
